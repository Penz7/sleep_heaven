name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Verify detector catches synthetic secret
        run: |
          mkdir -p .tmp-secret-scan
          echo "SLEEP_HEAVEN_TEST_SECRET=abcdefghijklmnop123456" > .tmp-secret-scan/synthetic.env
          set +e
          gitleaks detect --no-git --source .tmp-secret-scan --config .gitleaks.toml --redact --no-banner
          EXIT_CODE=$?
          set -e
          rm -rf .tmp-secret-scan
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Expected synthetic secret detection to fail, but gitleaks passed."
            exit 1
          fi
          echo "Synthetic secret detection check passed."

      - name: Scan repository
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
