name: Flutter Nightly Extended

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: flutter-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extended-integration:
    name: Nightly - extended integration matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - startup
          - services
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run extended suite
        run: |
          if [ "${{ matrix.suite }}" = "startup" ]; then
            flutter test test/startup
          else
            flutter test test/services test/integration
          fi

      - name: Upload suite report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-suite-${{ matrix.suite }}
          path: test

  dependency-audit:
    name: Nightly - dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Audit dependencies
        run: flutter pub outdated

  release-sanity:
    name: Nightly - release sanity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release sanity artifact
        run: flutter build apk --debug --dart-define=DEV_MODE=false

      - name: Upload release sanity artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-sanity-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  quarantine-smoke:
    name: Nightly - quarantine smoke
    runs-on: ubuntu-latest
    needs: extended-integration
    timeout-minutes: 15
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # D-06: flaky tests are isolated with explicit owner metadata.
      - name: Run quarantined smoke lane
        run: |
          echo "quarantine_owner=qa-core"
          echo "quarantine_policy=visible-not-silent"
          flutter test --tags=quarantine || true
