name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint-analyze:
    name: Stage 1 - format-lint-analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Stage marker
        run: echo "format-lint-analyze completed"

  unit-widget:
    name: Stage 2 - unit-widget
    runs-on: ubuntu-latest
    needs: format-lint-analyze
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # D-05: deterministic anti-flake policy: workflow-level reruns only.
      - name: Run unit and widget suites
        run: flutter test test/services test/startup test/widget_test.dart

      - name: Catalog contract tests
        run: flutter test test/data/catalog/catalog_schema_validation_test.dart test/data/catalog/catalog_loader_compatibility_test.dart

      - name: Stage marker
        run: echo "unit-widget completed"

  integration-smoke:
    name: Stage 3 - integration-smoke
    runs-on: ubuntu-latest
    needs: unit-widget
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # D-05: bounded smoke timeout and deterministic rerun behavior.
      - name: Run integration smoke checks
        run: flutter test test/integration test/startup/bootstrap_route_smoke_test.dart test/startup/iap_startup_restore_reconciliation_test.dart

      - name: Stage marker
        run: echo "integration-smoke completed"

  build-sanity:
    name: Stage 4 - build-sanity
    runs-on: ubuntu-latest
    needs: integration-smoke
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build debug APK (no release signing)
        run: flutter build apk --debug --dart-define=DEV_MODE=true

      - name: Stage marker
        run: echo "build-sanity completed"

